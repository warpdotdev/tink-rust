[package]
name = "tink-gcpkms"
version = "0.3.0"
authors = ["David Drysdale <drysdale@google.com>"]
edition = "2018"
license = "Apache-2.0"
description = "AWS-KMS integration for Rust port of Google's Tink cryptography library"
repository = "https://github.com/project-oak/tink-rust"
documentation = "https://docs.rs/tink-gcpkms"
readme = "README.md"
keywords = ["cryptography", "tink", "kms", "gcp"]
categories = ["cryptography"]
rust-version = "1.78.0"

[dependencies]
base64 = "^0.22"
chrono = "^0.4"
futures = "^0.3"
bytes = "^1.11"
http = "^1"
http-body-util = "^0.1"
hyper = { version = "^1", features = ["client", "http1"] }
hyper-util = { version = "^0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "=0.27.7", default-features = false, features = ["native-tokio", "http1", "ring", "tls12"] }
lazy_static = "^1.5"
percent-encoding = "^2.3"
serde = { version = "^1.0", features = ["derive"] }
rustls = { version = "^0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "^1.0.145"
tink-core = "^0.3"
tokio = "^1.48"
yup-oauth2 = "^12"
